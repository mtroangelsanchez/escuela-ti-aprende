<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escuela TI Aprende - Capacitaciones</title>
<style>
  :root { --bg:#1a1a2e; --card:#0f3460; --accent:#f5a623; --text:#fff; --muted:#b8b8cc; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  main { max-width:960px; margin:0 auto; padding:48px 20px; }
  h1 { margin:0 0 8px; }
  p.sub { color:var(--muted); margin:0 0 32px; }
  #msg { margin:0 0 24px; padding:12px 16px; border-radius:8px; background:rgba(245,166,35,.15); border:1px solid rgba(245,166,35,.3); display:none; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); }
  a.card { display:block; padding:20px; background:var(--card); border-radius:12px; color:inherit; text-decoration:none; border:1px solid transparent; transition:.15s; }
  a.card:hover, a.card:focus { border-color:var(--accent); transform:translateY(-2px); }
  .card h2 { margin:0 0 6px; font-size:1.1rem; color:var(--accent); }
  .card p { margin:0 0 10px; color:var(--muted); font-size:.92rem; }
  .card code { font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Escuela TI Aprende</h1>
  <p class="sub">Elige una capacitación o usa la URL: <code>?curso=nombre</code></p>
  <div id="msg" role="alert"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
/* Para agregar una capacitación: añade un objeto aquí. "ruta" es relativa a este archivo. */
const CURSOS = [
  { id: "cloud-practitioner", titulo: "AWS Cloud Practitioner (CLF-C02)", desc: "Guía por dominios, cronograma y simulador de examen.",
    ruta: "aws-cloud-practitioner-guide/guia.html", alias: ["clf", "clf-c02", "practitioner", "cloud"] },
  { id: "architecture", titulo: "AWS Solutions Architect Associate", desc: "Guía de estudio, cronograma y examen de práctica.",
    ruta: "aws-architecture-guide/index.html", alias: ["architect", "saa", "saa-c03", "solutions-architect"] },
  { id: "developer", titulo: "AWS Developer Associate", desc: "Desarrollo, seguridad y despliegue en AWS (documentos Markdown).",
    ruta: "https://github.com/mtroangelsanchez/escuela-ti-aprende/tree/main/aws-developer-guide", alias: ["dva", "dva-c02", "aws-developer"] },
  { id: "k8s-tanzu-pcf", titulo: "Kubernetes, Tanzu & PCF", desc: "Fundamentos y avanzado de K8s, VMware Tanzu y Pivotal Cloud Foundry.",
    ruta: "k8-tanzu-pcf-guide/index.html", alias: ["k8s", "k8", "kubernetes", "tanzu", "pcf"] },
  { id: "system-design", titulo: "Diseño de Sistemas", desc: "Guía completa con 12 ejemplos.",
    ruta: "system-design/index.html", alias: ["sistemas", "systemdesign", "system-design-interview"] }
];

const norm = s => (s || "").toLowerCase().trim().replace(/[\s_]+/g, "-");
const buscar = q => CURSOS.find(c => norm(c.id) === q || c.alias.some(a => norm(a) === q));

const params = new URLSearchParams(location.search);
const pedido = norm(params.get("curso") || params.get("c") || location.hash.replace(/^#\/?/, ""));
const msg = document.getElementById("msg");

if (pedido) {
  const curso = buscar(pedido);
  if (curso) {
    location.replace(curso.ruta);
  } else {
    msg.textContent = 'No existe la capacitación "' + pedido + '". Elige una de la lista.';
    msg.style.display = "block";
  }
}

const grid = document.getElementById("grid");
CURSOS.forEach(c => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = c.ruta;
  const h = document.createElement("h2"); h.textContent = c.titulo;
  const p = document.createElement("p"); p.textContent = c.desc;
  const code = document.createElement("code"); code.textContent = "?curso=" + c.id;
  a.append(h, p, code);
  grid.appendChild(a);
});
</script>
<noscript>
  <ul>
    <li><a href="aws-cloud-practitioner-guide/guia.html">AWS Cloud Practitioner</a></li>
    <li><a href="aws-architecture-guide/index.html">AWS Solutions Architect</a></li>
    <li><a href="k8-tanzu-pcf-guide/index.html">Kubernetes, Tanzu &amp; PCF</a></li>
    <li><a href="system-design/index.html">Diseño de Sistemas</a></li>
  </ul>
</noscript>
</body>
</html>
